services:
  # 1. Redis Cache & Queue Instance (type: keyvalue)
  - type: keyvalue
    name: erpnext-redis
    plan: free
    ipAllowList: [] # block public access, only allow internal traffic

  # 2. MariaDB Database (private docker service with standard image)
  - type: pserv
    name: erpnext-db
    runtime: image
    image:
      url: mariadb:10.6
    plan: starter # Disks are not supported on the free tier. Set to starter for persistence.
    disk:
      name: erpnext-db-data
      mountPath: /var/lib/mysql
      sizeGB: 10
    envVars:
      - key: MYSQL_ROOT_PASSWORD
        value: erpnext_root_secure_pass
      - key: MYSQL_DATABASE
        value: erpnext
      - key: MYSQL_USER
        value: erpnext
      - key: MYSQL_PASSWORD
        value: erpnext_secure_db_pass # Shared password for internal DB access (not exposed to internet)

  # 3. ERPNext App Web Service (unified container)
  - type: web
    name: erpnext-web
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    branch: version-16-hotfix
    plan: starter # Disks are not supported on the free tier. Set to starter for persistence.
    disk:
      name: erpnext-site-data
      mountPath: /home/frappe/frappe-bench/sites/site1.local
      sizeGB: 10
    envVars:
      - key: DB_HOST
        fromService:
          type: pserv
          name: erpnext-db
          property: host
      - key: DB_PORT
        value: 3306
      - key: DB_NAME
        value: erpnext
      - key: DB_USER
        value: erpnext
      - key: DB_PASSWORD
        value: erpnext_secure_db_pass # Matches MYSQL_PASSWORD in erpnext-db
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: erpnext-redis
          property: connectionString
      - key: SITE_NAME
        value: site1.local
      - key: ADMIN_PASSWORD
        generateValue: true
